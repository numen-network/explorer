type Block @entity {
  id: ID!
  height: Int! @index
  hash: String! @index @unique
  "hash the EVM side knows this block by, null at genesis"
  evmHash: String @index
  parentHash: String!
  "set by the timestamp inherent, null at genesis"
  timestamp: DateTime @index
  specVersion: Int!
  author: Account @index
  difficulty: BigInt!
  "minted for the miner on finalization"
  reward: BigInt!
  "fee share and tips the miner collected from the extrinsics in this block"
  minerFees: BigInt!
  "fee share those same extrinsics paid to the treasury"
  treasuryFees: BigInt!
  issuanceTotal: BigInt!
  issuanceInactive: BigInt!
  treasuryPot: BigInt!
  "the pow seal, which genesis has none of"
  nonce: String
  workHash: String
  finalized: Boolean! @index
  extrinsicCount: Int!
  eventCount: Int!
  "scale encoded digest items of the header, in header order"
  logs: [String!]!
}

"single row the explorer reads instead of talking to a node"
type ChainInfo @entity {
  id: ID!
  name: String!
  symbol: String!
  decimals: Int!
  ss58: Int!
  "target seconds per block, governance periods are counted in blocks"
  blockTime: Int!
  existentialDeposit: BigInt!
  "chain id the EVM side answers with"
  evmChainId: Int!
  "EVM address of the native balance ERC20 facade"
  nativeErc20: String!
  "blocks per session, boundaries land on multiples of it plus the offset"
  sessionLength: Int!
  sessionOffset: Int!
  "length of one conviction period, a vote holds its balance for a multiple of it"
  voteLockingPeriod: Int!
  "what a referendum submission reserves, the same on every track"
  submissionDeposit: BigInt!
  "sovereign account built from the Treasury pallet id"
  treasuryAccount: String!
  "chain head the indexer last saw, not the indexed head"
  head: Int!
  finalizedHead: Int!
}

type MinedObject @entity {
  id: ID!
  block: Block! @unique
  protocol: String!
  "gzip of little endian f64 xyz triples in node emission order"
  vertices: Bytes!
  vertexCount: Int!
}

type MeshTopology @entity {
  id: ID!
  "gzip of little endian u16 index triples, one row per protocol version"
  faces: Bytes!
  faceCount: Int!
}

type Account @entity {
  id: ID!
  free: BigInt!
  reserved: BigInt!
  balance: BigInt!
  frozen: BigInt!
  nonce: Int!
  firstSeenBlock: Int!
  "timestamp of the first seen block, null for an account born at genesis"
  firstSeenTimestamp: DateTime @index
  "null for an account that never signed, sealed or dispatched anything"
  lastActiveBlock: Int @index
  "when this account last sealed a block"
  lastMinedTimestamp: DateTime @index
  identityDisplay: String @index
  identityJson: JSON
  "judgement badge from 0 to 3 as verified, out of date, unjudged and flagged, null without a registration"
  identityRank: Int
  "the IdentitySet that turned this registration on, later edits keep it"
  identitySetBlock: Int
  "the sub name as readable text, only a Raw Data variant decodes to one"
  identitySubName: String
  "the Data the super filed for this sub, whole"
  identitySubData: JSON
  identitySuper: Account
  subs: [Account!]! @derivedFrom(field: "identitySuper")
  delegate: Delegate @derivedFrom(field: "account")
  "primary username granted through a username authority"
  username: String @index
  evmAddress: String @index
  vestingJson: JSON
  "balance locks with the lock id decoded from its eight bytes"
  locksJson: JSON
  "holds on the reserved balance, each with its RuntimeHoldReason whole"
  holdsJson: JSON
  "plain reserves the chain records no reason for, each read back from the pallet that took it"
  depositsJson: JSON
}

type Extrinsic @entity {
  id: ID!
  block: Block! @index
  indexInBlock: Int!
  hash: String! @index
  pallet: String! @index
  method: String! @index
  signer: Account @index
  calls: [Call!]! @derivedFrom(field: "extrinsic")
  "leaf calls under the root counted by name, as pallet, method and count in preorder of first appearance, null when the root wraps no call"
  leafCalls: JSON
  transfers: [Transfer!]! @derivedFrom(field: "extrinsic")
  success: Boolean!
  error: JSON
  "what running this extrinsic cost with the tip left out, null when it is unsigned and not an EVM call"
  fee: BigInt
  "tip the sender added, an EVM priority fee counted as one"
  tip: BigInt
  "share of the fee the miner kept, not counting the tip it also collects"
  minerFee: BigInt!
  "part of the fee that funded the treasury"
  treasuryFee: BigInt!
}

"one node of an extrinsic call tree, the root included"
type Call @entity {
  id: ID!
  extrinsic: Extrinsic! @index
  block: Block! @index
  "path of subcall indexes down from the root, empty at the root"
  address: [Int!]!
  parent: Call @index
  subcalls: [Call!]! @derivedFrom(field: "parent")
  pallet: String! @index
  method: String! @index
  args: JSON
  "null when the chain records no outcome for it, which only happens where nothing it did took effect, under a call that failed or past where its wrapper stopped"
  success: Boolean
  "who the call dispatches as, which proxy and multisig move away from the signer"
  origin: Account @index
  events: [Event!]! @derivedFrom(field: "call")
}

type Event @entity {
  id: ID!
  block: Block! @index
  extrinsic: Extrinsic @index
  "the call that raised it, which for a batch is one of the subcalls"
  call: Call @index
  indexInBlock: Int!
  phase: String!
  pallet: String! @index
  method: String! @index
  args: JSON
}

type EvmTransaction @entity {
  id: ID!
  extrinsic: Extrinsic! @unique
  block: Block! @index
  txIndex: Int!
  from: String! @index
  to: String @index
  contractAddress: String @index
  value: BigInt!
  input: Bytes!
  inputSelector: String @index
  nonce: Int!
  gasLimit: BigInt!
  gasUsed: BigInt!
  gasPrice: BigInt!
  "TransactionV2 variant name, Legacy, EIP2930, EIP1559 or EIP7702"
  txType: String!
  "ExitReason variant name"
  status: String!
  "the ExitReason the runtime reported, whole"
  exitReason: JSON!
  timestamp: DateTime! @index
}

type EvmLog @entity @index(fields: ["address", "logIndex"]) {
  id: ID!
  transaction: EvmTransaction! @index
  block: Block!
  logIndex: Int!
  address: String! @index
  topic0: String @index
  topics: [String!]!
  data: Bytes!
}

type Token @entity {
  id: ID!
  name: String
  symbol: String @index
  decimals: Int
  "what the contract answered to totalSupply at the last block that moved it, null when it answered nothing"
  totalSupply: BigInt
  "holders whose last balanceOf answer was above zero"
  holderCount: Int!
  transferCount: Int!
  "the create tx, absent for factory built contracts and for deployments older than the index range"
  deployTx: EvmTransaction
  "block the first transfer landed in, the earliest the token can be known without a create tx"
  firstBlock: Int!
  "the first of the two tokens a Uniswap V2 style pair pools, as its token0() answered, absent for any other token"
  token0: String
  "the second, as its token1() answered"
  token1: String
  "what token0 answered to symbol(), absent when it answered nothing"
  token0Symbol: String
  "what token1 answered to symbol(), absent when it answered nothing"
  token1Symbol: String
  "proxy kind evm-proxy-detection recognized at the last block that moved the token, absent when it is no proxy"
  proxyType: String
  "what the proxy delegated to at that block, one per facet for a diamond"
  implementations: [String!]
}

type TokenTransfer @entity {
  id: ID!
  token: Token! @index
  from: String! @index
  to: String! @index
  amount: BigInt!
  transaction: EvmTransaction!
  block: Block!
  logIndex: Int!
  timestamp: DateTime! @index
}

type TokenHolder @entity @index(fields: ["token", "balance"]) {
  id: ID!
  token: Token! @index
  address: String! @index
  "what the contract answered to balanceOf at the last block that moved this holder, null when it answered nothing"
  balance: BigInt
}

"an address that sent, received or created an EVM transaction, or sent or received a token"
type EvmAddress @entity {
  id: ID!
  "EVM transactions it sent, received or created"
  txCount: Int!
  "earliest block holding one of its transactions or token transfers"
  firstSeenBlock: Int!
  "latest block where it sent an EVM transaction, null if it never sent one"
  lastActiveBlock: Int
}

"""every pallet and method the chain has actually seen at any depth of a call tree, so a call picker offers real options instead of a hardcoded list"""
type CallKind @entity {
  "pallet.method"
  id: ID!
  pallet: String! @index
  method: String!
}

"""every pallet and method of an event the chain has actually raised, so an event picker offers real options"""
type EventKind @entity {
  "pallet.method"
  id: ID!
  pallet: String! @index
  method: String!
}

type Judgement @entity @index(fields: ["registrar", "block"]) {
  "the id of the JudgementGiven event that recorded it"
  id: ID!
  registrar: Registrar! @index
  target: Account! @index
  "the verdict read back from storage at the event's block, absent when that block also cleared the identity"
  kind: String
  "only a FeePaid verdict carries one, it is the amount the registrar was paid up front"
  fee: BigInt
  block: Int! @index
  timestamp: DateTime!
}

type Registrar @entity {
  "the index into the registrar list, which is what judgements point at"
  id: ID!
  index: Int! @index @unique
  "null once the seat is retired, along with fee and fields"
  account: Account @index
  fee: BigInt
  fields: BigInt
  "block of the RegistrarAdded event, null for a registrar the chain started with"
  addedAt: Int
  "block of the RegistrarRemoved event, null while the seat is held"
  retiredAt: Int
  retiredTimestamp: DateTime
  requestCount: Int!
  givenCount: Int!
  lastJudgementBlock: Int
  lastJudgementAt: DateTime
}

"a username from the moment its authority grants it until the chain drops it"
type Username @entity {
  "the full username, suffix included"
  id: ID!
  owner: Account! @index
  suffix: String! @index
  "Pending while it waits in PendingUsernames, Unbinding while UnbindingUsernames holds it, Active otherwise"
  status: String! @index
  "block a pending username lapses at, or the first block an unbinding one can be removed at"
  expiresAt: Int
  "the Provider variant name"
  provider: String!
  "what the authority reserved for an AuthorityDeposit username"
  deposit: BigInt
  "whether it is the name UsernameOf maps its owner to"
  primary: Boolean!
  "block of the UsernameQueued or UsernameSet that granted it"
  grantedBlock: Int! @index
  grantedAt: DateTime!
}

type UsernameAuthority @entity {
  "the suffix the authority grants usernames under"
  id: ID!
  account: Account! @index
  "usernames it can still grant without a deposit"
  allocation: Int!
  "its usernames that are active or unbinding"
  usernameCount: Int!
  "block of the AuthorityAdded that brought the suffix in, null for a suffix the chain started with"
  addedBlock: Int
  addedAt: DateTime
}

type Track @entity {
  id: ID!
  "the TrackId as a number, id holds it as a string"
  index: Int! @index @unique
  name: String!
  maxDeciding: Int!
  "ceiling the track origin can approve, set by pallet_custom_origins, absent on tracks that release no funds"
  maxSpend: BigInt
  decisionDeposit: BigInt!
  preparePeriod: Int!
  decisionPeriod: Int!
  confirmPeriod: Int!
  minEnactmentPeriod: Int!
  "pallet_referenda Curve as the runtime constant carries it, Perbill and FixedI64 fields count in billionths"
  minApproval: JSON!
  minSupport: JSON!
}

"ReferendumInfo variant names"
enum ReferendumStatus {
  Ongoing
  Approved
  Rejected
  Cancelled
  TimedOut
  Killed
}

type Referendum @entity {
  id: ID!
  index: Int! @index @unique
  track: Track! @index
  "the proposal origin as the submit call carried it, whole"
  origin: JSON
  proposalHash: String
  "first line of the noted metadata preimage, the rest of it is the description"
  title: String
  description: String
  "the call a proposal runs, read back from the runtime whether it sits inline or behind a preimage"
  proposalPallet: String @index
  proposalMethod: String @index
  "the proposal call tree flattened in preorder, each node with its address and args, spend nodes carrying what they pay and when"
  proposalCalls: JSON
  "what the proposal asks the treasury for, summed over its spends"
  proposalAmount: BigInt
  "how many spends the proposal holds, more than one makes it staged"
  proposalPayouts: Int
  "set when every spend pays one account"
  proposalBeneficiary: String
  "bounty this referendum moves to approve, taken from the proposal call"
  proposalBountyIndex: Int @index
  submitter: Account @index
  submittedAt: Int!
  submittedTimestamp: DateTime! @index
  "an ongoing one keeps its phase in decidingSince and confirmingSince"
  status: ReferendumStatus! @index
  decidingSince: Int
  confirmingSince: Int
  endedAt: Int
  ayes: BigInt!
  nays: BigInt!
  support: BigInt!
  "one step per lifecycle event, its id, qualified name, block and timestamp, an enactment step adds the error its dispatch failed with or null"
  timeline: JSON!
  "plain reserves the chain records no reason for, cleared once refunded or slashed"
  submissionDepositor: String @index
  submissionDeposit: BigInt
  decisionDepositor: String @index
  decisionDeposit: BigInt
}

type Vote @entity {
  id: ID!
  referendum: Referendum! @index
  voter: Account! @index
  "AccountVote variant, Standard, Split or SplitAbstain"
  kind: String! @index
  "Standard only, the aye bit of the vote"
  aye: Boolean @index
  "Standard only, the Conviction variant name"
  conviction: String
  "Standard only"
  balance: BigInt
  "Split and SplitAbstain parts"
  ayeAmount: BigInt
  nayAmount: BigInt
  "SplitAbstain only"
  abstainAmount: BigInt
  block: Int!
  removed: Boolean!
  """
  the block the vote stops holding its balance, the end of a referendum it lost or
  did not carry conviction into, the end plus the conviction periods on one it
  won, or the block it came off an ongoing referendum. null while the referendum
  is still ongoing and the vote stands
  """
  lockedUntil: Int
  """
  the block a VoteUnlocked on the vote's track freed it, its lock run out, the vote
  gone from the account's voting record and the track's lock set to what that
  record still asks for. remove_vote raises no event once the referendum is over,
  and removed keeps saying whether the vote left the tally
  """
  unlockedAt: Int
}

"""
a delegation a referendum counts through the standard vote its target holds
there, left as it stood when the referendum ended
"""
type DelegatedVote @entity {
  "the referendum index and the delegator"
  id: ID!
  referendum: Referendum! @index
  "the delegation target, whose standard vote carries the delegation"
  voter: Account!
  delegator: Account!
  "the Conviction variant name"
  conviction: String!
  balance: BigInt!
  "set while the delegation does not count, its target's vote taken off or split or the delegation undone"
  removed: Boolean!
  block: Int!
}

"""
one row per vote cast or removed on a referendum, and one per delegation
change that moved its tally through the standard vote its target held
"""
type VotingAction @entity @index(fields: ["referendum", "block", "indexInBlock"]) {
  "the referendum index and the id of the event, a delegation event moves every referendum its target voted on"
  id: ID!
  referendum: Referendum!
  "whose vote the row moves, the delegation target on a delegation row"
  voter: Account!
  "the account delegating or undelegating, null on a vote row"
  delegator: Account
  "Voted, VoteRemoved, Delegated or Undelegated"
  method: String!
  "AccountVote variant, Standard, Split or SplitAbstain, a remove row keeps the vote it took off the tally and a delegation row the standard vote of its target"
  kind: String!
  "Standard only, the aye bit of the vote"
  aye: Boolean
  "Standard only, the Conviction variant name"
  conviction: String
  "Standard only"
  balance: BigInt
  "Split and SplitAbstain parts"
  ayeAmount: BigInt
  nayAmount: BigInt
  "SplitAbstain only"
  abstainAmount: BigInt
  "conviction weighted sum of the delegations on the voter's casting record at the end of the block, as the chain keeps it"
  delegatedVotes: BigInt!
  "how far the block moved the approval, approvalPart over approvalWhole, read off the tally snapshots and set on the referendum's last row in the block only"
  approvalPart: BigInt
  approvalWhole: BigInt
  "the support the block added or took away, supportWhole is the active issuance at its end"
  supportPart: BigInt
  supportWhole: BigInt
  block: Int!
  "position of the event in its block"
  indexInBlock: Int!
  timestamp: DateTime!
}

"append-only metadata log, one row per MetadataSet or MetadataCleared event, so every text a referendum ever carried stays readable"
type MetadataAction @entity {
  id: ID!
  referendum: Referendum! @index
  "MetadataSet or MetadataCleared, a cleared row carries no text"
  method: String!
  "preimage the pointer moved to or came off"
  hash: String!
  "null when the preimage was missing or held no first line"
  title: String
  description: String
  block: Int!
  timestamp: DateTime!
}

"tally read back from chain storage at each block a voting action landed in"
type ReferendumTallySnapshot @entity {
  id: ID!
  referendum: Referendum! @index
  block: Int! @index
  ayes: BigInt!
  nays: BigInt!
  support: BigInt!
  "issuance at the same block, the support denominator is total less inactive"
  totalIssuance: BigInt!
  inactiveIssuance: BigInt!
}

type Delegation @entity {
  id: ID!
  who: Account! @index
  target: Account! @index
  track: Track!
  "the Conviction variant name"
  conviction: String!
  "the N of LockedNx, 0 for None"
  convictionLevel: Int!
  balance: BigInt!
  "the balance weighted by its conviction, a tenth of it for None and N times it for LockedNx"
  votes: BigInt!
  block: Int!
}

"append-only delegation log, one row per Delegated or Undelegated event"
type DelegationAction @entity {
  "the id of the event"
  id: ID!
  who: Account! @index
  target: Account! @index
  track: Track!
  "Delegated or Undelegated"
  method: String!
  "the Conviction variant name of the delegation the event set up or ended, null when the same block set it up and undid it"
  conviction: String
  balance: BigInt
  block: Int!
  "position of the event in its block"
  indexInBlock: Int!
  timestamp: DateTime!
}

"an account that delegations currently point to, one row while any do"
type Delegate @entity @index(fields: ["delegated", "delegators"]) {
  "the account id"
  id: ID!
  account: Account! @unique
  delegators: Int!
  "how many tracks the delegations cover"
  tracks: Int!
  "each delegator's largest balance across tracks, summed, since conviction locks overlap"
  delegated: BigInt!
}

type TreasurySpend @entity {
  id: ID!
  "referendum whose enactment created this spend, matched by scheduler task"
  referendum: Referendum @index
  "the Treasury call family, spend_local or spend"
  kind: String!
  beneficiary: Account!
  amount: BigInt!
  "method of the last Treasury event the spend raised"
  status: String! @index
  block: Int!
  "indexInBlock of the event that approved the spend"
  indexInBlock: Int!
  "first block a spend can be claimed at, spend_local has no window"
  validFrom: Int
  "block the claim window closes at"
  expireAt: Int
  "block of the last Paid event, which sets a payout apart from an expiry since both end in SpendProcessed"
  paidAt: Int
  "position of the spend call in the referendum's proposalCalls"
  proposalCall: Int
}

type Bounty @entity {
  id: ID!
  index: Int! @index @unique
  "referendum that moves to approve this bounty, resolved from its call"
  referendum: Referendum @index
  proposer: Account
  value: BigInt!
  "curator fee taken out of the value on payout"
  fee: BigInt
  "reserved from the proposer until the bounty is funded or rejected"
  bond: BigInt
  "reserved from the curator while they hold the job"
  curatorDeposit: BigInt
  curator: Account @index
  beneficiary: Account
  description: String
  "BountyStatus variant name while the chain holds the bounty, then the method of the event that dropped it"
  status: String! @index
  unlockAt: Int
  updateDue: Int
  payout: BigInt
  createdAt: Int!
  updatedAt: Int! @index
  "one step per lifecycle event, its id, qualified name, block and timestamp"
  timeline: JSON!
}

type ChildBounty @entity {
  id: ID!
  parent: Bounty! @index
  childIndex: Int!
  value: BigInt!
  fee: BigInt
  "reserved from the curator while they hold the job"
  curatorDeposit: BigInt
  curator: Account
  beneficiary: Account
  description: String
  "ChildBountyStatus variant name while the chain holds the child, then the method of the event that dropped it"
  status: String! @index
  payout: BigInt
  createdAt: Int!
  updatedAt: Int!
}

type MultisigOp @entity {
  id: ID!
  multisig: Account! @index
  callHash: String! @index
  depositor: Account! @index
  "reserved from the depositor until the call runs or is called off"
  deposit: BigInt
  "approver account ids in approval order"
  approvals: [String!]!
  threshold: Int
  "full signer set recovered from the opening call when unambiguous"
  signatories: [String!]
  "method of the last Multisig event the operation raised"
  status: String! @index
  "DispatchResult of an executed operation, whole"
  result: JSON
  createdBlock: Int!
  updatedBlock: Int! @index
}

type ProxyRelation @entity {
  id: ID!
  delegator: Account! @index
  delegatee: Account! @index
  proxyType: String!
  "announcement delay in blocks"
  delay: Int!
}

type PrimeState @entity {
  id: ID!
  account: Account!
  since: Int!
}

type Validator @entity {
  id: ID!
  account: Account! @unique
  active: Boolean! @index
  lockedAmount: BigInt!
  lockExpiry: Int
  offlineSessions: Int!
  equivocations: Int!
  "the reason ValidatorKicked carried, whole"
  kicked: JSON
  firstSeenBlock: Int!
  "the last session it was active in, null if it never was"
  lastActiveSession: Int
}

type DailyStat @entity {
  id: ID!
  date: DateTime! @index
  blocks: Int!
  extrinsicsSigned: Int!
  transfers: Int!
  transferVolume: BigInt!
  evmTxs: Int!
  fees: BigInt!
  tsFirst: DateTime!
  tsLast: DateTime!
  difficultyClose: BigInt!
  issuanceTotal: BigInt!
  issuanceInactive: BigInt!
  "every account's transferable balance summed at the day's last block, inactive issuance included"
  issuanceTransferable: BigInt!
  treasuryPot: BigInt!
  cumExtrinsicsSigned: BigInt!
  cumTransfers: BigInt!
  cumTransferVolume: BigInt!
  "accounts the chain had seen by the end of the day"
  accountsTotal: Int!
  "referenda submitted by the end of the day"
  referendaTotal: Int!
  "accounts that sealed at least one block that day"
  minersActive: Int!
  "minted for the miners of that day's blocks"
  rewards: BigInt!
}

type HourlyStat @entity {
  id: ID!
  hour: DateTime! @index
  block: Block! @index
  "every account's transferable balance summed at the hour's last block, inactive issuance included"
  issuanceTransferable: BigInt!
  issuanceInactive: BigInt!
}

type MinerDayStat @entity @index(fields: ["day", "blocks"]) {
  id: ID!
  day: String! @index
  account: Account! @index
  blocks: Int!
  rewards: BigInt!
}

type Transfer @entity @index(fields: ["from", "timestamp"]) @index(fields: ["to", "timestamp"]) {
  id: ID!
  block: Block!
  extrinsic: Extrinsic
  "the call that moved the money, which a batch or a proxy hides from the extrinsic"
  call: Call @index
  from: Account!
  to: Account!
  amount: BigInt!
  timestamp: DateTime! @index
}
