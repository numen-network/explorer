# Only these packages may run install scripts. Everything else is inert, which
# is the cheapest defence against a compromised transitive dependency.
# bufferutil and utf-8-validate are native speedups ws falls back from, es5-ext
# only prints a donation notice, and the apollo postinstall sets up a cli we
# never call.
allowBuilds:
  '@apollo/protobufjs': false
  bufferutil: false
  es5-ext: false
  utf-8-validate: false
# substrate-runtime 2.1.0 drops the type of every constant it reads from v16
# metadata, the patch maps the field until a release does it.
patchedDependencies:
  '@subsquid/substrate-runtime@2.1.0': patches/@subsquid__substrate-runtime@2.1.0.patch
